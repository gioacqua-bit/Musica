[package]
name = "musica"
version = "0.1.0"
description = "Offline music player with a strange-attractor visualizer"
authors = ["Gio"]
license = "MIT"
edition = "2021"
rust-version = "1.77"

[lib]
name = "musica_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
walkdir = "2"
lofty = "0.22"
symphonia = { version = "0.5", features = ["all"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
strip = true
panic = "abort"
